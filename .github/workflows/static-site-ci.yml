name: Static site CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject private Telegram invite links
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'https://t\.me/\+' --exclude-dir=.git .; then
            echo "::error::Private Telegram invite URL found in public site source."
            exit 1
          fi

      - name: Verify required static assets
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s style.css
          test -s script.js
          test -s robots.txt
          test -s sitemap.xml

      - name: Validate local HTML assets and sitemap XML
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import xml.etree.ElementTree as ET

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for name in ("href", "src"):
                      value = values.get(name, "")
                      if value and not value.startswith(("http://", "https://", "#", "mailto:", "tel:")):
                          self.paths.append(value.split("?", 1)[0].split("#", 1)[0])

          parser = Assets()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          missing = sorted({p for p in parser.paths if p and not Path(p).exists()})
          if missing:
              raise SystemExit(f"Missing local assets: {missing}")
          ET.parse("sitemap.xml")

      - name: Check JavaScript syntax
        run: node --check script.js
